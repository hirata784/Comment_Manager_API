<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>コメント管理API</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <header class="header">学習ブログ</header>
    <div class="search">
        <h2>投稿ID検索</h2>
        <input type="text" class="search-txt" id="js-search-txt">
        <button class="search-display" id="js-search-btn">表示</button>
    </div>
    <div class="error-search" id="js-error-search"></div>
    <div class="inner">
        <div class="post-content">
            <div>
                <h2 class="center-line">投稿内容</h2>
                <div id="js-post-content">
                </div>
            </div>
        </div>
        <div class="comment-list">
            <h2 class="center-line">コメント一覧</h2>
            <div id="js-comment-list">
            </div>
        </div>
        <form action="" class="input-form" id="js-form">
        </form>
        <div class="post-list">
            <h2 class="center-line">投稿一覧</h2>
            <div id="js-post-list">
            </div>
        </div>
    </div>
    <script src="./main.js"></script>
</body>

</html>
